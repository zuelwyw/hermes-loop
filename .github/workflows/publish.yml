name: Release checks

# GitHub-only releases: never publish to npm from this repository workflow.
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-checks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Release tag must match package version
        if: github.event_name == 'release'
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          test "$PKG" = "$GITHUB_REF_NAME"
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
